[package]
name = "postgr-es"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
cqrs-es.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
tokio = { version = "1.52.3", features = ["sync"] }
event-sorcery.workspace = true
sqlite-es.workspace = true
postgres-es = { git = "https://github.com/0xgleb/cqrs", rev = "c65e492ec7af67b9e9f996d7491cfbec3664562b", version = "0.5.0" }

[features]
integration-tests = []

[lints]
workspace = true

[dev-dependencies]
async-trait.workspace = true
event-sorcery = { workspace = true, features = ["test-support"] }
proptest = "1.11.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
