[package]
name = "sqlite-es"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
cqrs-es.workspace = true
indexed-query.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
] }
chrono = "0.4.45"
tokio = { version = "1.52.3", features = ["rt", "sync"] }
event-sorcery-core.workspace = true
futures-util.workspace = true
event-sorcery.workspace = true
async-trait.workspace = true

[lints]
workspace = true

[dev-dependencies]
apalis-core.workspace = true
chrono = "0.4.45"
criterion = { version = "0.8.2", features = ["async_tokio"] }
event-sorcery = { workspace = true, features = ["test-support"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "test-util"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"

[[bench]]
name = "store"
harness = false
