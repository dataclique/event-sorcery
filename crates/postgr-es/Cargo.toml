[package]
name = "postgr-es"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
cqrs-es.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
chrono = "0.4.45"
tokio = { version = "1.52.3", features = ["rt", "sync"] }
event-sorcery.workspace = true
sqlite-es.workspace = true
futures-util = "0.3.32"
postgres-es = { git = "https://github.com/0xgleb/cqrs", rev = "3f9742deca7d94f5dac73db6809518940a0d3a9c", version = "0.5.0" }

[features]
integration-tests = []

[lints]
workspace = true

[dev-dependencies]
async-trait.workspace = true
event-sorcery = { workspace = true, features = ["test-support"] }
proptest = "1.11.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
